services:
  - type: web
    name: zad-academy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@zadacademy.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/zad_academy.db
    disk:
      name: zad-academy-data
      mountPath: /var/data
      sizeGB: 1

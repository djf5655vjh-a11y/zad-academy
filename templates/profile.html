{% extends "base.html" %}{% block content %}<div class="eyebrow">PLAYER PROFILE</div><h1>{{ user.name }}</h1><section class="profile-card"><div class="avatar">{{ user.name[:1]|upper }}</div><h2>{{ user.name }}</h2><p class="muted">{{ user.email }}</p><div class="stats-grid"><div class="stat-card"><b>{{ user.xp }}</b><small>XP</small></div><div class="stat-card"><b>{{ user.streak }}</b><small>Day streak</small></div><div class="stat-card"><b>{{ done }}</b><small>Lessons done</small></div></div><a class="btn primary" href="{{ url_for('premium') }}">Explore Premium →</a></section>{% endblock %}

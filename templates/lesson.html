{% extends "base.html" %}{% block content %}<a class="back" href="{{ url_for('course',slug=lesson.slug) }}">← {{ lesson.course_title }}</a><section class="lesson-card"><div class="lesson-progress"><span>MISSION</span><span>+20 XP</span></div><div class="progress-track"><i style="width:45%"></i></div><div class="eyebrow">LEARN THE CONCEPT</div><h1>{{ lesson.title }}</h1><p class="lesson-body">{{ lesson.body }}</p><div class="question-box"><div class="eyebrow">QUICK CHECK</div><h3>{{ lesson.question }}</h3><form method="post" class="option-list">{% for option in options %}<label class="option"><input type="radio" name="choice" value="{{ loop.index0 }}" required><span>{{ option }}</span></label>{% endfor %}<button class="btn primary full">Check answer →</button></form></div></section>{% endblock %}
